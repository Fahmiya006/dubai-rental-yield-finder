<script>
/* ============ CORE (pure functions, also tested in node) ============ */
function buyingCosts(price,cfg,financed,loan){
  var b=cfg.buying_costs;
  var agent=price*b.agent_pct*(1+b.agent_vat_pct);
  var tb=price>=b.trustee_threshold?b.trustee_fee_high:b.trustee_fee_low;
  var t=price*b.dld_transfer_pct+b.dld_admin_fee+agent+tb*(1+b.trustee_vat_pct);
  if(financed)t+=(loan||0)*b.mortgage_registration_pct;
  return t;
}
function netYield(price,rent,size,cfg,o){
  o=o||{};var r=cfg.running_costs;
  var scs=o.sc!=null?o.sc:r.service_charge_aed_sqft, vac=o.vac!=null?o.vac:r.vacancy_pct,
      mg=o.mgmt!=null?o.mgmt:r.management_pct, mt=o.maint!=null?o.maint:r.maintenance_pct_of_rent;
  var sc=scs*size, noi=rent-sc-rent*vac-rent*mg-rent*mt, buy=buyingCosts(price,cfg), inv=price+buy;
  return {gross:rent/price,net:noi/inv,noi:noi,buy:buy,sc:sc,inv:inv,payback:noi>0?inv/noi:Infinity};
}
function mortgagePmt(loan,rate,years){var i=rate/12,n=years*12;return i===0?loan/n:loan*i/(1-Math.pow(1+i,-n));}
function fitPredict(p,h,win,damp){
  win=win||36;damp=damp||0.97;var y=p.slice(-win).map(Math.log),n=y.length,sx=0,sy=0,sxy=0,sxx=0;
  for(var i=0;i<n;i++){sx+=i;sy+=y[i];sxy+=i*y[i];sxx+=i*i;}
  var slope=(n*sxy-sx*sy)/(n*sxx-sx*sx),lvl=y[n-1],s=slope,out=[];
  for(var k=0;k<h;k++){s*=damp;lvl+=s;out.push(Math.exp(lvl));}return out;
}
function forecastGrowth(p,h){h=h||12;if(p.length<24)return NaN;return fitPredict(p,h)[h-1]/p[p.length-1]-1;}
function std(a){var n=a.length;if(n<2)return NaN;var m=a.reduce(function(x,y){return x+y},0)/n;return Math.sqrt(a.reduce(function(x,y){return x+(y-m)*(y-m)},0)/(n-1));}
function mean(a){return a.reduce(function(x,y){return x+y},0)/a.length;}
function summarizeJS(panel,cfg){
  var g={};panel.forEach(function(r){var k=r.area+'|'+r.property_type;(g[k]=g[k]||[]).push(r);});
  var rows=[];
  Object.keys(g).forEach(function(k){
    var a=g[k].sort(function(x,y){return x.month<y.month?-1:1}),last=a.slice(-6),
        pr=mean(last.map(function(r){return r.avg_price})),rt=mean(last.map(function(r){return r.avg_rent_annual})),
        sz=mean(last.map(function(r){return r.avg_size_sqft})),ny=netYield(pr,rt,sz,cfg),
        prices=a.map(function(r){return r.avg_price}),ch=[];
    for(var i=1;i<prices.length;i++)ch.push(prices[i]/prices[i-1]-1);
    var parts=k.split('|');
    rows.push({area:parts[0],property_type:parts[1],price:pr,rent:rt,size_sqft:sz,gross_yield:ny.gross,net_yield:ny.net,
      payback_years:ny.payback,growth_12m:forecastGrowth(prices,12),volatility:std(ch.slice(-24)),months:a.length});
  });
  var tr=rows.map(function(r){return r.net_yield+0.5*(isNaN(r.growth_12m)?0:r.growth_12m)});
  var vols=rows.map(function(r){return r.volatility}).filter(function(v){return !isNaN(v)}),vm=vols.length?mean(vols):0;
  var vv=rows.map(function(r){return isNaN(r.volatility)?vm:r.volatility}),mo=rows.map(function(r){return Math.min(r.months,60)});
  function z(a){var m=mean(a),s=std(a)||1;return a.map(function(x){return (x-m)/s})}
  var zt=z(tr),zv=z(vv),zm=z(mo);
  rows.forEach(function(r,i){r.total_return=tr[i];r.score=0.6*zt[i]-0.2*zv[i]+0.2*zm[i];});
  rows.sort(function(a,b){return b.score-a.score});return rows;
}
function seriesFromPanel(panel){
  var g={},out={};panel.forEach(function(r){var k=r.area+'|'+r.property_type;(g[k]=g[k]||[]).push(r);});
  Object.keys(g).forEach(function(k){var a=g[k].sort(function(x,y){return x.month<y.month?-1:1}).filter(function(_,i){return i%3===0});
    out[k]={m:a.map(function(r){return r.month.slice(0,7)}),p:a.map(function(r){return Math.round(r.avg_price)}),r:a.map(function(r){return Math.round(r.avg_rent_annual)})};});
  return out;
}
function parseCSV(text){
  var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim()}),
      split=function(l){var o=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){q=!q}else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(function(s){return s.trim()})};
  var head=split(lines[0]),need=['area','property_type','month','avg_price','avg_rent_annual','avg_size_sqft'];
  var miss=need.filter(function(n){return head.indexOf(n)<0});if(miss.length)throw new Error('Missing columns: '+miss.join(', '));
  var out=[];for(var i=1;i<lines.length;i++){var c=split(lines[i]),r={};head.forEach(function(h,j){r[h]=c[j]});
    r.avg_price=+r.avg_price;r.avg_rent_annual=+r.avg_rent_annual;r.avg_size_sqft=+r.avg_size_sqft;
    if(r.avg_price>0&&r.avg_rent_annual>0&&r.avg_size_sqft>0&&/^\d{4}-\d{2}/.test(r.month))out.push(r);}
  if(out.length<24)throw new Error('Need at least 24 valid rows.');return out;
}
function priceForNetYield(target,rent,size,cfg){ // price at which a buyer gets `target` net yield
  var noi=netYield(1e6,rent,size,cfg).noi;if(noi<=0)return NaN;var lo=1e4,hi=1e9;
  for(var i=0;i<60;i++){var mid=(lo+hi)/2;var inv=mid+buyingCosts(mid,cfg);if(noi/inv>target)lo=mid;else hi=mid;}return (lo+hi)/2;
}

function hashPw(email,pw){
  var enc=new TextEncoder().encode('ryf-demo|'+email+'|'+pw);
  if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',enc).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')});

}

      buy=buyingCosts(c.price,cfg,c.fin,loan),inv=c.price+buy,noi=ny.noi,pmt=c.fin?mortgagePmt(loan,c.rate,c.yrs):0,

function checkUpdate(){

  if(a==='tocalc'){var p=t.getAttribute('data-k').split('|'),r=rowOf(p[0],p[1]);S.calc=null;S.calc={area:r.area,type:r.property_type,price:Math.round(r.price),rent:Math.round(r.rent),size:Math.round(r.size_sqft),sc:S.cfg.running_costs.service_charge_aed_sqft,vac:S.cfg.running_costs.vacancy_pct,mgmt:S.cfg.running_costs.management_pct,maint:S.cfg.running_costs.maintenance_pct_of_rent,g:Math.max(-0.05,Math.min(0.15,r.growth_12m||0.05)),fin:false,ltv:0.7,rate:S.cfg.mortgage.rate,yrs:S.cfg.mortgage.years};S.sheet=null;S.tab='calc';render();return}
  if(a==='askabout'){var p2=t.getAttribute('data-k').split('|');S.sheet=null;S.tab='chat';render();ask('Tell me about '+p2[1]+' in '+p2[0]+' and whether it looks like a good buy.');return}
  if(a==='mode'){S.listing.mode=t.getAttribute('data-t');render();return}
  if(a==='ask'){ask(t.getAttribute('data-q'));return}
  if(a==='authmode'){S.authMode=S.authMode==='in'?'up':'in';render();return}
  if(a==='logout'){logout();return}
  if(a==='engine'){S.engine=t.getAttribute('data-t');render();return}
  if(a==='cur'){S.inr=t.getAttribute('data-t')==='inr';savePrefs();render();return}
  if(a==='theme'){var th=t.getAttribute('data-t');applyTheme(th==='system'?'':th);savePrefs();render();return}
  if(a==='resetdata'){S.rows=D.rows;S.series=D.series;S.synthetic=D.synthetic;S.src=D.source;S.bt=D.backtest;usetJ('dataset',null);render();return}
  if(a==='wipe'){if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Tap again to delete everything';return}
    if(SERVER){api('DELETE','/api/account',{password:document.getElementById('del-pw').value}).then(function(){S.user=null;logout()}).catch(function(e){t.dataset.sure='';t.textContent='Delete my account and saved data';toast(e.message)});return}
    var us=users();delete us[S.user.email];sset('ryf_users',JSON.stringify(us));['prefs','watch','calc','chat','dataset'].forEach(function(k){sdel(uk(k))});logout();return}
  if(a==='savename'){var nm=document.getElementById('p-name').value;api('PUT','/api/profile',{name:nm}).then(function(j){S.user=j.user;render();toast('Name saved')}).catch(function(e){toast(e.message)});return}
  if(a==='chpw'){var o=document.getElementById('pw-old'),n=document.getElementById('pw-new');api('POST','/api/password',{old:o.value,new:n.value}).then(function(){o.value='';n.value='';toast('Password changed. Other devices were logged out.')}).catch(function(e){toast(e.message)});return}
});
document.addEventListener('input',function(e){
  var id=e.target.id;if(!id)return;
  if(id==='q'){S.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}return}
  if(id==='fx'){var v=+e.target.value;if(v>0){S.fx=v;savePrefs()}return}
  if(id.indexOf('c-')===0&&S.calc){
    var m={'c-price':'price','c-rent':'rent','c-size':'size','c-sc':'sc','c-vac':'vac','c-mgmt':'mgmt','c-maint':'maint','c-g':'g','c-ltv':'ltv','c-rate':'rate','c-yrs':'yrs'};
    if(m[id]){S.calc[m[id]]=+e.target.value}
    if(id==='c-fin'){S.calc.fin=e.target.checked;document.getElementById('fin-box').hidden=!S.calc.fin}
    usetJ('calc',S.calc);calcUpdate();return}
  if(id.indexOf('l-')===0){var L=S.listing;if(id==='l-price')L.price=+e.target.value;if(id==='l-size')L.size=+e.target.value;if(id==='l-rent')L.rent=+e.target.value;checkUpdate()}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='c-area'||id==='c-type'){S.calc.area=document.getElementById('c-area').value;S.calc.type=document.getElementById('c-type').value;var r=rowOf(S.calc.area,S.calc.type);if(r){S.calc.price=Math.round(r.price);S.calc.rent=Math.round(r.rent);S.calc.size=Math.round(r.size_sqft);S.calc.g=Math.max(-0.05,Math.min(0.15,r.growth_12m||0.05))}render();return}
  if(id==='l-area'||id==='l-type'){S.listing.area=document.getElementById('l-area').value;S.listing.type=document.getElementById('l-type').value;var r2=rowOf(S.listing.area,S.listing.type);if(r2&&!S.listing.size){S.listing.size=Math.round(r2.size_sqft)}render();return}
  if(id==='csv'){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){
    try{var panel=parseCSV(String(rd.result)),rows=summarizeJS(panel,S.cfg);S.rows=rows;S.series=seriesFromPanel(panel);S.synthetic=false;S.src=null;S.bt={n:0};usetJ('dataset',{rows:rows,series:S.series});S.tab='home';render();toast('Imported '+rows.length+' area and type combinations')}
    catch(x){document.getElementById('csv-err').textContent=x.message}};rd.readAsText(f)}
});
document.getElementById('app').innerHTML='<div class="empty">Loading…</div>';
fetch('/api/me',{credentials:'same-origin'}).then(function(r){var ct=r.headers.get('content-type')||'';if(!r.ok||ct.indexOf('json')<0)throw 0;return r.json()})
 .then(function(j){return {ok:true,j:j}},function(){return {ok:false}})
 .then(function(x){
   if(!x.ok){SERVER=false;bootSession();render();return}
   SERVER=true;if(!x.j.user){render();return}
   S.user=x.j.user;
   return api('GET','/api/data').then(function(d){UC=d.data||{}}).catch(function(){UC={}}).then(function(){loadPrefs();render()});
 });
initAI();
</script>

<title>Dubai Yield Finder</title>
<meta name="description" content="Compare Dubai areas by rental yield after real UAE buying costs, with growth estimates, a calculator, listing check and AI assistant.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: responsive website. Phone: header + content + bottom tabs. Laptop: header with top nav and two-column pages.
   Original teal and gold palette. Only the former greys are replaced with bold teal. */
:root{
  --panel:#EEF3F3; --bg:#EEF3F3; --surface:#FFFFFF; --ink:#0D2B33; --muted:#5B7279; --line:#D8E2E3;
  --accent:#0F8B84; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF;
  --gold:#B7791F; --gold-soft:#F8EBCF; --good:#13795B; --bad:#B4412F; --bad-soft:#F7DDD7;
  --chart-a:#0F8B84; --chart-b:#B7791F; --grid:#E3EBEC;
  --f-display:'Sora','Segoe UI',system-ui,sans-serif; --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:var(--muted);opacity:1}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.top{padding:12px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));background:var(--surface);position:relative}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo-img{width:auto;flex:none;display:block}
.topnav{display:none}
.topnav button{background:none;border:0;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--muted)}
.topnav button:hover{background:var(--accent-soft)}
.topnav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;font-family:var(--f-display);flex:none}
main{flex:1;min-height:0;overflow-y:auto;padding:12px max(10px,env(safe-area-inset-left,0px)) 14px max(10px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.wrap{max-width:1100px;min-height:100%;box-sizing:border-box;margin:0 auto;padding:14px 6px 24px}
.wrap.narrow{max-width:820px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:24px;line-height:1.2} h2{font-size:18px} h3{font-size:15px}
.sub{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.list1,.list2{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.charts{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips>*{flex:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill.syn{background:var(--gold-soft);color:var(--gold)}
.pill.good{background:var(--accent-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.rank{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--f-display)}
.item{transition:transform .12s,box-shadow .12s,border-color .12s;cursor:pointer;min-height:64px}
.item:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(13,43,51,.08);transform:translateY(-1px)}
.item:active{transform:scale(.99)}
.item .bar{height:4px;border-radius:4px;background:var(--accent-soft);margin-top:7px;overflow:hidden}
.item .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.chart-card svg{overflow:visible}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted)}
.item .y{text-align:right;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--good)}
.item .y small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
input[type=file]{color:var(--ink);max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=range],input[type=file],input[type=checkbox]{background:transparent;accent-color:var(--accent)}
input[type=file]::file-selector-button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700;margin-right:10px}
.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn[disabled]{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.note{font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.sheet-bg{position:absolute;inset:0;background:rgba(5,15,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.login{flex:1;overflow-y:auto;padding:max(32px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-left,0px)) 24px max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;justify-content:center;align-items:center}
.login>*{width:100%;max-width:440px}
.login{background:transparent}
.auth-card{background:var(--surface);padding:26px 22px;border-radius:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 36px rgba(13,43,51,.12)}
.login>.brand{background:var(--surface);padding:12px 18px;border-radius:16px;width:auto;box-shadow:0 6px 20px rgba(13,43,51,.1)}
.chat{display:flex;flex-direction:column;gap:10px;min-height:100%}
.msgs{display:flex;flex-direction:column;gap:10px;flex:1}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;padding:10px;background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--line);width:100%;max-width:820px;align-self:center}
.composer input{flex:1}
.err{color:var(--bad);font-size:13px;min-height:18px}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.tog{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.tog button{flex:1;border:0;background:var(--surface);padding:9px;font-weight:600;color:var(--muted)}
.tog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:30;max-width:90%}

/* ===== Glass / dot-matrix design language ===== */
.card{border:0;border-radius:24px;box-shadow:0 2px 0 rgba(255,255,255,.7) inset,0 8px 24px rgba(13,43,51,.07);padding:16px}
.stat{border:0;border-radius:20px;box-shadow:0 8px 20px rgba(13,43,51,.07)}
.btn{border-radius:99px;padding:13px 20px}
.btn.ghost{background:var(--surface)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select{border-radius:16px;border:1px solid var(--line);padding:13px 14px}
.chips{padding:4px;background:var(--surface);border-radius:99px;box-shadow:0 6px 16px rgba(13,43,51,.06);width:max-content;max-width:100%;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:transparent;padding:8px 16px;color:var(--muted);transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tog{border:0;border-radius:99px;background:var(--surface);padding:4px;gap:4px}
.tog button{border-radius:99px;background:transparent}
.tog button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sheet>*,.glass{flex:none}
.glass{position:relative;overflow:hidden;border-radius:28px;padding:18px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 30px rgba(40,30,90,.22)}
.glass .lab{font-size:13px;font-weight:600;opacity:.9}
.glass .val{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin-top:6px}
.glass .val small{font-size:13px;font-weight:600;opacity:.85;letter-spacing:0;margin-left:6px}
.glass .foot{font-size:12px;opacity:.85;margin-top:4px}
.glass svg.dots{display:block;width:100%;height:auto;margin-top:10px}
.glass svg.dots text{fill:#fff;fill-opacity:.85;font-size:10px;font-family:var(--f-body)}
.g-purple{background:radial-gradient(120% 90% at 85% 20%,#B68CE0 0,transparent 60%),radial-gradient(90% 80% at 10% 90%,#2F2358 0,transparent 70%),linear-gradient(135deg,#5E4A9E,#8E6CC4)}
.g-blue{background:radial-gradient(90% 80% at 80% 90%,#B9DDFB 0,transparent 65%),radial-gradient(80% 70% at 15% 20%,#6C7FD8 0,transparent 70%),linear-gradient(160deg,#7C93E0,#9CC3F2)}
.g-coral{background:radial-gradient(90% 80% at 15% 90%,#D6584A 0,transparent 65%),radial-gradient(90% 80% at 85% 15%,#F6B6AC 0,transparent 70%),linear-gradient(160deg,#EE8E80,#F3A59B)}
.g-green{background:radial-gradient(90% 80% at 85% 90%,#8FD6A6 0,transparent 65%),radial-gradient(90% 80% at 10% 15%,#E6D08A 0,transparent 70%),linear-gradient(160deg,#6BBB86,#A5D8A4)}
.g-pink{background:radial-gradient(90% 80% at 85% 20%,#F9A6C6 0,transparent 60%),radial-gradient(90% 80% at 10% 95%,#E1B96A 0,transparent 65%),linear-gradient(135deg,#E8559A,#F27AA8)}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtiles .glass{min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
.gtiles .glass .val{font-size:28px}
.hl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-radius:22px;padding:12px 14px;box-shadow:0 8px 20px rgba(13,43,51,.06);transition:transform .12s}
.hl:hover{transform:translateY(-1px)}
.hl .ic{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.hl .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hl .tt{font-weight:700;overflow-wrap:anywhere}
.hl .ds{font-size:12px;color:var(--muted)}
.hl .tag{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.sect{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15px;margin:2px 2px 0}
.sect i{width:9px;height:9px;border-radius:50%;display:inline-block}
.item{border:0;border-radius:22px;box-shadow:0 8px 20px rgba(13,43,51,.06);grid-template-columns:40px minmax(0,1fr) auto}
.item:hover{border:0;box-shadow:0 12px 26px rgba(13,43,51,.12)}
.rank{width:40px;height:40px;border-radius:50%;color:#fff;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.rk0{background:linear-gradient(135deg,#5E4A9E,#B68CE0)}.rk1{background:linear-gradient(135deg,#6C7FD8,#9CC3F2)}.rk2{background:linear-gradient(135deg,#E8559A,#F6B6AC)}.rk3{background:linear-gradient(135deg,#3E9F66,#A5D8A4)}
.item .y{background:var(--accent-soft);padding:6px 11px;border-radius:99px;font-size:15px}
.item .y small{display:none}
.item .bar{height:6px;background:none;overflow:hidden;position:relative;margin-top:8px}
.item .bar::before,.item .bar i{content:"";position:absolute;left:0;top:0;height:6px;background:radial-gradient(circle at 3px 3px,var(--accent) 2px,transparent 2.4px) 0 0/8px 6px repeat-x}
.item .bar::before{width:100%;opacity:.2}
.item .bar i{border-radius:0}
.dock{display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{display:flex;align-items:center;gap:6px;background:var(--surface);padding:7px;border-radius:99px;box-shadow:0 10px 28px rgba(13,43,51,.18)}
.dock button{width:46px;height:46px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.dock .ask{white-space:nowrap;width:auto;padding:0 18px 0 8px;gap:9px;display:flex;align-items:center;background:var(--ink);color:var(--surface);font-weight:700;font-size:14px;height:46px;border-radius:99px}
.dock .ask[aria-current="page"]{background:var(--ink);color:var(--surface);box-shadow:0 0 0 3px var(--accent)}
.dock .orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#F7B5E2 28%,#8E6CC4 62%,#3FA7E6 100%);flex:none}
.topnav{background:var(--surface);padding:4px;border-radius:99px;box-shadow:0 6px 16px rgba(13,43,51,.08);flex:none!important;margin-left:24px}
.topnav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.top{box-shadow:0 4px 18px rgba(13,43,51,.07)}
.sheet{background:var(--panel);border-radius:28px 28px 0 0}
.gtiles.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.gtiles.three .glass{min-height:104px;padding:14px}.gtiles.three .glass .val{font-size:22px}
.yb{display:flex;flex-direction:column;gap:6px}
.yrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,1fr) 52px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 4px;border-radius:14px}
.yrow:hover{background:var(--accent-soft)}
.yn{display:flex;flex-direction:column;min-width:0}
.yn b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yn small{font-size:11px;color:var(--muted)}
.ytrack{height:12px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.ytrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6C7FD8,#8E6CC4)}
.ytrack i.first{background:linear-gradient(90deg,#E8559A,#F6B6AC)}
.yv{font-weight:700;font-size:14px;text-align:right}
.hero-num{font-family:var(--f-display);font-weight:700;font-size:38px;letter-spacing:-.02em;line-height:1.05}
@media(min-width:760px){.list2{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr 1fr}}
@media(min-width:900px){
  .dock{display:none}
  .gtiles{grid-template-columns:1fr 1fr}
  .home-grid .list2{grid-template-columns:1fr}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
  main{padding:20px 28px}
  .wrap{padding:26px 30px 30px}
  .topnav{display:flex;gap:6px;margin-left:24px;flex:1}
  nav.tabs{display:none}
  .cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:26px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:20px;max-height:90%}
  .toast{bottom:28px}
}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}

/* landing */
.land{flex:1;overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch}
.l-nav{position:sticky;top:0;z-index:5;background:var(--surface);box-shadow:0 4px 18px rgba(13,43,51,.07);padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
.l-nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.l-links{display:none;gap:4px}
.l-links a{padding:8px 12px;border-radius:99px;font-weight:600;color:var(--fg);text-decoration:none;font-size:14px}
.l-links a:hover{background:var(--accent-soft)}
.l-cta{display:flex;gap:8px;align-items:center}
.l-cta .btn{padding:9px 16px;font-size:14px;white-space:nowrap}
.l-hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#d9eee2 0,#eef6f0 38%,var(--bg) 70%)}
.l-hero-in{max-width:1180px;margin:0 auto;padding:44px max(18px,env(safe-area-inset-left,0px)) 36px max(18px,env(safe-area-inset-right,0px));display:grid;gap:22px;grid-template-columns:minmax(0,1fr);position:relative;z-index:1}
.l-hero h1{font-size:clamp(30px,6vw,52px);line-height:1.08;max-width:15ch}
.l-hero p{font-size:clamp(15px,2.4vw,18px);color:var(--muted);max-width:44ch;margin:0}
.l-hero .btn{padding:14px 26px;font-size:16px;width:max-content;box-shadow:0 10px 24px rgba(20,120,80,.28)}
.l-sky{position:absolute;right:0;bottom:0;width:min(560px,70%);opacity:.9;pointer-events:none;z-index:0}
.l-cards{max-width:1180px;margin:0 auto;padding:6px max(18px,env(safe-area-inset-left,0px)) 40px max(18px,env(safe-area-inset-right,0px));display:grid;gap:12px;grid-template-columns:minmax(0,1fr);position:relative;z-index:2;margin-top:-18px}
.l-card{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:0 10px 28px rgba(13,43,51,.1);border:0;text-align:left;color:var(--fg);font:inherit}
.l-card b{font-family:var(--f-display);font-size:16px}
.l-card .big{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--accent);margin-top:6px}
.l-card .sm{color:var(--muted);font-size:13px;margin-top:2px}
.l-note{max-width:1180px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px)) 36px max(18px,env(safe-area-inset-right,0px));color:var(--muted);font-size:12.5px}
.l-back{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;align-self:flex-start}
@media (min-width:760px){.l-links{display:flex}.l-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.l-hero-in{padding-top:72px;padding-bottom:70px}}

.l-hero{min-height:520px;background:linear-gradient(105deg,#cfe9db 0,#e6f2ea 30%,#f3f7f4 62%,var(--bg) 100%)}
.l-hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;min-width:22px;background:linear-gradient(90deg,rgba(214,69,65,.78),rgba(214,69,65,.55) 60%,rgba(214,69,65,0));filter:blur(3px);z-index:0}
.l-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(100deg,rgba(35,35,38,.34) 0,rgba(35,35,38,.14) 34%,rgba(255,255,255,0) 58%);clip-path:polygon(0 38%,64% 100%,0 100%);z-index:0}
.l-sky{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:100%;opacity:.55;z-index:0}
.l-maps{display:none}
.l-hero-in{padding-bottom:150px}
.l-cards{margin-top:-120px}
@media (min-width:760px){.l-hero{min-height:600px}.l-sky{width:64%;height:auto;opacity:1}.l-maps{display:inline}.l-hero-in{padding-top:96px;padding-bottom:170px}.l-hero h1{max-width:13ch}}

.l-sky{position:absolute;right:0;top:0;height:100%;width:auto;max-width:none;opacity:1;z-index:0;object-fit:cover;object-position:left top;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%),linear-gradient(to bottom,#000 78%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 30%),linear-gradient(to bottom,#000 78%,transparent 100%);mask-composite:intersect}
@media (max-width:759px){.l-sky{opacity:.5;height:58%;top:auto;bottom:0}}
@media (min-width:760px){.l-sky{width:auto;height:100%;opacity:1}}

.l-hero{background:linear-gradient(105deg,#9fd3b5 0,#cfe8d9 26%,#eef4f0 58%,var(--bg) 100%)}
.l-hero::before{width:8%;background:linear-gradient(90deg,rgba(200,28,40,.95),rgba(200,28,40,.78) 55%,rgba(200,28,40,0));filter:blur(2px)}
.l-hero::after{height:38%;background:linear-gradient(100deg,rgba(15,15,18,.78) 0,rgba(15,15,18,.4) 34%,rgba(255,255,255,0) 60%);clip-path:polygon(0 36%,66% 100%,0 100%)}

.l-hero{background:linear-gradient(105deg,#5fb88a 0,#a9d9bf 24%,#e2efe7 56%,var(--bg) 100%)}
.l-hero::before{width:9%;background:linear-gradient(90deg,rgba(176,16,30,1),rgba(176,16,30,.85) 55%,rgba(176,16,30,0));filter:blur(2px)}
.l-hero::after{height:40%;background:linear-gradient(100deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.55) 34%,rgba(255,255,255,0) 62%)}
.l-hero p{color:#1f3a3a;font-weight:500}
.l-hero-in{padding-left:max(44px,env(safe-area-inset-left,0px))}
@media (max-width:759px){.l-hero-in{padding-left:max(30px,env(safe-area-inset-left,0px))}}

<script>
/* ============ CORE (pure functions, also tested in node) ============ */
function buyingCosts(price,cfg,financed,loan){
  var b=cfg.buying_costs;
  var agent=price*b.agent_pct*(1+b.agent_vat_pct);
  var tb=price>=b.trustee_threshold?b.trustee_fee_high:b.trustee_fee_low;
  var t=price*b.dld_transfer_pct+b.dld_admin_fee+agent+tb*(1+b.trustee_vat_pct);
  if(financed)t+=(loan||0)*b.mortgage_registration_pct;
  return t;
}
function netYield(price,rent,size,cfg,o){
  o=o||{};var r=cfg.running_costs;
  var scs=o.sc!=null?o.sc:r.service_charge_aed_sqft, vac=o.vac!=null?o.vac:r.vacancy_pct,
      mg=o.mgmt!=null?o.mgmt:r.management_pct, mt=o.maint!=null?o.maint:r.maintenance_pct_of_rent;
  var sc=scs*size, noi=rent-sc-rent*vac-rent*mg-rent*mt, buy=buyingCosts(price,cfg), inv=price+buy;
  return {gross:rent/price,net:noi/inv,noi:noi,buy:buy,sc:sc,inv:inv,payback:noi>0?inv/noi:Infinity};
}
function mortgagePmt(loan,rate,years){var i=rate/12,n=years*12;return i===0?loan/n:loan*i/(1-Math.pow(1+i,-n));}
function fitPredict(p,h,win,damp){
  win=win||36;damp=damp||0.97;var y=p.slice(-win).map(Math.log),n=y.length,sx=0,sy=0,sxy=0,sxx=0;
  for(var i=0;i<n;i++){sx+=i;sy+=y[i];sxy+=i*y[i];sxx+=i*i;}
  var slope=(n*sxy-sx*sy)/(n*sxx-sx*sx),lvl=y[n-1],s=slope,out=[];
  for(var k=0;k<h;k++){s*=damp;lvl+=s;out.push(Math.exp(lvl));}return out;
}
function forecastGrowth(p,h){h=h||12;if(p.length<24)return NaN;return fitPredict(p,h)[h-1]/p[p.length-1]-1;}
function std(a){var n=a.length;if(n<2)return NaN;var m=a.reduce(function(x,y){return x+y},0)/n;return Math.sqrt(a.reduce(function(x,y){return x+(y-m)*(y-m)},0)/(n-1));}
function mean(a){return a.reduce(function(x,y){return x+y},0)/a.length;}
function summarizeJS(panel,cfg){
  var g={};panel.forEach(function(r){var k=r.area+'|'+r.property_type;(g[k]=g[k]||[]).push(r);});
  var rows=[];
  Object.keys(g).forEach(function(k){
    var a=g[k].sort(function(x,y){return x.month<y.month?-1:1}),last=a.slice(-6),
        pr=mean(last.map(function(r){return r.avg_price})),rt=mean(last.map(function(r){return r.avg_rent_annual})),
        sz=mean(last.map(function(r){return r.avg_size_sqft})),ny=netYield(pr,rt,sz,cfg),
        prices=a.map(function(r){return r.avg_price}),ch=[];
    for(var i=1;i<prices.length;i++)ch.push(prices[i]/prices[i-1]-1);
    var parts=k.split('|');
    rows.push({area:parts[0],property_type:parts[1],price:pr,rent:rt,size_sqft:sz,gross_yield:ny.gross,net_yield:ny.net,
      payback_years:ny.payback,growth_12m:forecastGrowth(prices,12),volatility:std(ch.slice(-24)),months:a.length});
  });
  var tr=rows.map(function(r){return r.net_yield+0.5*(isNaN(r.growth_12m)?0:r.growth_12m)});
  var vols=rows.map(function(r){return r.volatility}).filter(function(v){return !isNaN(v)}),vm=vols.length?mean(vols):0;
  var vv=rows.map(function(r){return isNaN(r.volatility)?vm:r.volatility}),mo=rows.map(function(r){return Math.min(r.months,60)});
  function z(a){var m=mean(a),s=std(a)||1;return a.map(function(x){return (x-m)/s})}
  var zt=z(tr),zv=z(vv),zm=z(mo);
  rows.forEach(function(r,i){r.total_return=tr[i];r.score=0.6*zt[i]-0.2*zv[i]+0.2*zm[i];});
  rows.sort(function(a,b){return b.score-a.score});return rows;
}
function seriesFromPanel(panel){
  var g={},out={};panel.forEach(function(r){var k=r.area+'|'+r.property_type;(g[k]=g[k]||[]).push(r);});
  Object.keys(g).forEach(function(k){var a=g[k].sort(function(x,y){return x.month<y.month?-1:1}).filter(function(_,i){return i%3===0});
    out[k]={m:a.map(function(r){return r.month.slice(0,7)}),p:a.map(function(r){return Math.round(r.avg_price)}),r:a.map(function(r){return Math.round(r.avg_rent_annual)})};});
  return out;
}
function parseCSV(text){
  var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim()}),
      split=function(l){var o=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){q=!q}else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(function(s){return s.trim()})};
  var head=split(lines[0]),need=['area','property_type','month','avg_price','avg_rent_annual','avg_size_sqft'];
  var miss=need.filter(function(n){return head.indexOf(n)<0});if(miss.length)throw new Error('Missing columns: '+miss.join(', '));
  var out=[];for(var i=1;i<lines.length;i++){var c=split(lines[i]),r={};head.forEach(function(h,j){r[h]=c[j]});
    r.avg_price=+r.avg_price;r.avg_rent_annual=+r.avg_rent_annual;r.avg_size_sqft=+r.avg_size_sqft;
    if(r.avg_price>0&&r.avg_rent_annual>0&&r.avg_size_sqft>0&&/^\d{4}-\d{2}/.test(r.month))out.push(r);}
  if(out.length<24)throw new Error('Need at least 24 valid rows.');return out;
}
function priceForNetYield(target,rent,size,cfg){ // price at which a buyer gets `target` net yield

}

function hashPw(email,pw){
  var enc=new TextEncoder().encode('ryf-demo|'+email+'|'+pw);
  if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',enc).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')});
  var h=5381;for(var i=0;i<enc.length;i++)h=((h<<5)+h+enc[i])|0;return Promise.resolve(String(h));
}

  s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  if(fc!=null){s+='<path d="M'+x(n-1).toFixed(1)+' '+y(vals[n-1]).toFixed(1)+' L'+x(tot-1).toFixed(1)+' '+y(fc).toFixed(1)+'" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="'+x(tot-1).toFixed(1)+'" cy="'+y(fc).toFixed(1)+'" r="4" fill="var(--gold)"/><text x="'+(W-pr)+'" y="'+(y(fc)-9).toFixed(1)+'" text-anchor="end" style="fill:var(--gold);font-weight:700">Next 12 months (estimate)</text>';}

function dotChart(vals,o){

function agentBackend(history,steps){
  var msgs=history.map(function(m){return {role:m.role,content:m.content}});
  var defs=TOOLS.map(function(t){return {name:t.name,description:t.description,input_schema:t.inputSchema}});
  function step(n){
    if(n>=6)return Promise.resolve('I hit my step limit. Here is what I found so far; ask me to continue.');
    return fetch('/api/agent',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-requested-with':'ryf'},body:JSON.stringify({system:ctxAgent(),messages:msgs,tools:defs})})
     .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'error');return j})})
     .then(function(j){
       if(j.stop_reason==='tool_use'){
         msgs.push({role:'assistant',content:j.content});
         var res=j.content.filter(function(b){return b.type==='tool_use'}).map(function(b){return {type:'tool_result',tool_use_id:b.id,content:JSON.stringify(runTool(b.name,b.input,steps))}});
         msgs.push({role:'user',content:res});return step(n+1);
       }
       return j.content.filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('').trim();
     });
  }
  return step(0);
}
function ask(q){

  var history=S.chat.slice(0,-1).map(function(m){return {role:m.role,content:m.content}});
  var fallback=function(e,why){done(localAnswer(q)+'\n\n('+why+' This came from the built-in helper.)')};
  if(S.engine==='mini'&&AI.mini){miniAsk(q,steps,done,fallback);return}
  if(AI.backend){agentBackend(history,steps).then(function(t){done(t||localAnswer(q))}).catch(function(e){fallback(e,'The AI server had a problem: '+e.message+'.')});return}
  if(AI.sample){
    var h=history.slice();h[0]={role:'user',content:AGENT_SYS+'\n\n'+ctxAgent()+'\n\nConversation starts. User: '+h[0].content};
    var tools=TOOLS.map(function(t){return {name:t.name,description:t.description,inputSchema:t.inputSchema,execute:function(i){return runTool(t.name,i,steps)}}});

      .then(function(r){done(r.text||localAnswer(q))})
      .catch(function(e){if(e&&e.code==='not_granted'){AI.sample=null;AI.state='local'}fallback(e,e&&e.code==='rate_limited'?'The AI is busy.':'The AI was not available.')});
  }else setTimeout(function(){done(localAnswer(q))},250);
}

    var lab=ty||'any';return {q:ty?l:'best yield',facts:'F: best '+lab+'|'+sel.map(function(r){return r.area+' '+(r.net_yield*100).toFixed(1)}).join('|'),label:'top 3 for '+lab}}

function miniAsk(q,steps,done,fallback){

  steps.push('Mini-GPT (my own model)','facts: '+f.label);
  Promise.race([api('POST','/api/minigpt',{prompt:f.facts+'\nQ: '+f.q+'\nA: '}),new Promise(function(_,rej){setTimeout(function(){rej(new Error('it took too long to answer'))},25000)})]).then(function(r){
    var ans=(r&&r.text)||'',have=(f.facts.match(/\d[\d,]*\.?\d*/g)||[]).map(function(x){return x.replace(/[.,]+$/,'')}),
        used=(ans.match(/\d[\d,]*\.?\d*/g)||[]).map(function(x){return x.replace(/[.,]+$/,'')});
    var ok=ans&&used.every(function(x){return have.indexOf(x)>=0});
    if(ok)done(ans);else{steps.push('check failed');done(localAnswer(q)+'\n\n(Mini-GPT printed a number that is not in the data, so the app discarded its answer and used the built-in helper.)')}
  }).catch(function(e){fallback(e,'Mini-GPT had a problem: '+e.message+'.')});
}
function findAreas(q){var l=q.toLowerCase(),alias={'jvc':'Jumeirah Village Circle','jlt':'Jumeirah Lake Towers','marina':'Dubai Marina','downtown':'Downtown Dubai','bb':'Business Bay','dso':'Dubai Silicon Oasis','palm':'Palm Jumeirah','hills':'Dubai Hills Estate','creek':'Dubai Creek Harbour','sports city':'Dubai Sports City','international city':'International City'};

  Object.keys(alias).forEach(function(k){if(new RegExp('\\b'+k+'\\b').test(l)&&f.indexOf(alias[k])<0&&areas().indexOf(alias[k])>=0)f.push(alias[k])});return f}

    var p=1e6;if(num){var v=+num[1],u=(num[3]||'').toLowerCase();if(/m|million/.test(u))v*=1e6;else if(u==='k')v*=1e3;else if(/cr|crore/.test(u))v*=1e7/S.fx*1;else if(/l|lakh/.test(u))v*=1e5/S.fx;if(v>=1e5)p=v}

  if(/net yield|gross yield|what is yield|explain|meaning|how.*(calc|work)/.test(l)){

  if(A.length===1){var rs=S.rows.filter(function(r){return r.area===A[0]&&(!T||r.property_type===T)});return pre+rs.map(line).join('\n')}

    if(!rs2.length)return 'Nothing in the data fits that budget. Try a higher figure.';
    return pre+'Top picks'+(T?' for '+T:'')+':\n'+rs2.slice(0,3).map(function(r,i){return (i+1)+'. '+line(r)}).join('\n')+'\nThey rank well on net yield plus forecast growth. Open one for charts and costs.'}
  return 'I can help with: best areas (try "best 1 bedroom under 900k"), comparing two areas, buying costs for a price, mortgage examples, and how yield is calculated. For anything legal or visa-related, check official sources.';
}

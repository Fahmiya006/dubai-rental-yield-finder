# Render Blueprint (free). On render.com: New > Blueprint > pick this repo > Apply.
# Free plan: sleeps after about 15 minutes idle, and accounts are wiped when it restarts (no disk).
# For permanent accounts use render.paid.yaml instead (copy its contents into this file).
services:
  - type: web
    name: dubai-rental-yield-finder
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: RYF_DB
        value: /tmp/app.db
      # Optional: set in the Render dashboard if you have a real key. The Mini-GPT needs none.
      - key: ANTHROPIC_API_KEY
        sync: false
